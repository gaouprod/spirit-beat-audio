# Grille rythmique des morceaux (beatgrid/run.py), pour les enchaînements calés
# sur le temps des séances 40fit.
#
# Lancé par SPIRIT-BEAT après l'analyse de chaque morceau sans grille beat_this
# (musique et morceaux réservés aux séances), ou à la main (rattrapage).
# Dépôt PUBLIC (minutes GitHub Actions gratuites) : le workflow ne reçoit que
# des identifiants ; les adresses audio sont demandées à SPIRIT-BEAT et masquées ;
# le résultat (des nombres) repart à POST <SPIRIT-BEAT>/api/pipeline/beatgrid,
# qui ne remplace jamais une grille d'un moteur plus précis.
# Secret de dépôt : PIPELINE_SECRET. Variable facultative : SPIRIT_BEAT_URL.
name: Grille rythmique

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Identifiants des morceaux SPIRIT-BEAT, séparés par des virgules"
        required: true
      callback:
        description: "Renvoyer les grilles à SPIRIT-BEAT (true/false)"
        default: "true"

permissions:
  contents: read

concurrency:
  group: beatgrid-${{ inputs.ids }}
  cancel-in-progress: false

jobs:
  beatgrid:
    if: github.repository == 'gaouprod/spirit-beat-audio'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPIRIT_BEAT_URL: ${{ vars.SPIRIT_BEAT_URL || 'https://spirit-beat.vercel.app' }}
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: beatgrid/requirements.txt
      - name: Morceaux à traiter
        env:
          IDS: ${{ inputs.ids }}
          OUT_FILE: tracks.json
        run: python fetch_tracks.py
      - name: Modèle beat_this (cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub
          key: beat-this-final0
      - name: Dépendances (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet "torch==2.3.1" "torchaudio==2.3.1" --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r beatgrid/requirements.txt
          pip install --quiet https://github.com/CPJKU/beat_this/archive/main.zip
      - name: Grille rythmique
        env:
          TRACKS_FILE: tracks.json
          RESULTS_FILE: beatgrid-results.json
        run: python beatgrid/run.py
      - name: Retour à SPIRIT-BEAT
        if: ${{ inputs.callback == 'true' }}
        run: |
          curl --fail-with-body -sS -w "\nretour SPIRIT-BEAT : HTTP %{http_code}\n" --retry 3 --retry-all-errors --max-time 120 \
            -X POST "${SPIRIT_BEAT_URL%/}/api/pipeline/beatgrid" \
            -H "Authorization: Bearer $PIPELINE_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @beatgrid-results.json \
            | grep -oE '"(count|outcome)":[^,}]*' | sort | uniq -c
